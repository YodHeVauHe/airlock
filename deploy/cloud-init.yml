#cloud-config
# Vultr "Cloud-Init user-data" for a fresh Ubuntu 24.04 VM.
# Paste this into the Vultr console when deploying; it installs Docker,
# clones Airlock, builds the sandbox image, and boots the control plane.
# Replace the git URL (and optionally add your inference key below).
package_update: true
packages: [git, ca-certificates, curl]
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  - git clone --depth 1 https://github.com/YOURNAME/airlock.git /srv/airlock
  - cd /srv/airlock
  - |
    cat > .env <<EOF
    AIRLOCK_PUBLIC_URL=http://$(curl -s https://api.ipify.org)
    AIRLOCK_INFERENCE_API_KEY=
    AIRLOCK_INFERENCE_MODEL=
    AIRLOCK_MOCK_LLM=1
    EOF
  - docker build -t airlock-sandbox:latest ./sandbox
  - docker compose -f deploy/docker-compose.yml up -d --build
  - echo "Airlock deployed on $(curl -s https://api.ipify.org)" > /var/log/airlock-ready
